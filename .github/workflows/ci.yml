name: Native CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/native-build.yml
  package:
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-*
          path: downloads
      - name: Validate same-run cross-platform package
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python scripts/release/artifacts.py unpack downloads/native-macos/native.tar inputs/macos
          python scripts/release/artifacts.py unpack downloads/native-windows/native.tar inputs/windows
          python scripts/release/artifacts.py assemble --inputs inputs --bundle package/ULID.bundle --sha "$SOURCE_SHA"
          python scripts/release/artifacts.py inventory package package-provenance.json --sha "$SOURCE_SHA"
