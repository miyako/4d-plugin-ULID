name: Manual pinned 4D host smoke

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native host platform (Windows host support is not yet locally validated)
        type: choice
        required: true
        options:
          - macos
          - windows
      runtime_url:
        description: Explicit HTTPS tool4d tar.xz archive URL (no automatic latest resolution)
        type: string
        required: true
      runtime_sha256:
        description: Independently verified SHA-256 of exact runtime archive bytes (lowercase hex)
        type: string
        required: true
      runtime_path:
        description: Forward-slash executable path inside archive (e.g. tool4d.app/Contents/MacOS/tool4d)
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/native-build.yml
  host-smoke:
    needs: build
    runs-on: ${{ inputs.platform == 'macos' && 'macos-15' || 'windows-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-${{ inputs.platform }}
          path: downloads
      - name: Validate the same-run native artifact
        env:
          SOURCE_SHA: ${{ github.sha }}
          PLATFORM: ${{ inputs.platform }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release/artifacts.py unpack downloads/native.tar build/package
          python scripts/release/artifacts.py verify --bundle build/package/ULID.bundle --target "$PLATFORM" --sha "$SOURCE_SHA" --manifest build/package/provenance.json
          mkdir -p build/host-work
      - name: Verify and extract explicitly selected runtime
        id: runtime
        env:
          RUNTIME_URL: ${{ inputs.runtime_url }}
          RUNTIME_SHA256: ${{ inputs.runtime_sha256 }}
          RUNTIME_PATH: ${{ inputs.runtime_path }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release/runtime_archive.py --url "$RUNTIME_URL" --sha256 "$RUNTIME_SHA256" \
            --runtime-path "$RUNTIME_PATH" --archive build/runtime.tar.xz --destination build/runtime \
            --report build/runtime-provenance.json
      - name: Real interpreted host smoke
        env:
          RUNTIME: ${{ steps.runtime.outputs.runtime }}
          TMPDIR: ${{ github.workspace }}/build/host-work
          TMP: ${{ github.workspace }}/build/host-work
          TEMP: ${{ github.workspace }}/build/host-work
        shell: bash
        run: python scripts/host_smoke.py --runtime "$RUNTIME" --report build/host-interpreted.json
      - name: Require clean compilation and real compiled host smoke
        env:
          RUNTIME: ${{ steps.runtime.outputs.runtime }}
          TMPDIR: ${{ github.workspace }}/build/host-work
          TMP: ${{ github.workspace }}/build/host-work
          TEMP: ${{ github.workspace }}/build/host-work
        shell: bash
        run: python scripts/host_smoke.py --runtime "$RUNTIME" --compiled --report build/host-compiled.json
      - name: Retain structured reports, not the runtime distribution
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: host-smoke-${{ inputs.platform }}
          path: |
            build/host-*.json
            build/runtime-provenance.json
            build/package/provenance.json
          if-no-files-found: warn
