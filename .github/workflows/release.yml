name: Signed draft release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: New release tag (vX.Y.Z), matching Info.plist on the selected ref
        required: true
        type: string
      publication:
        description: Explicit authorization (creates a draft only; never publishes)
        type: choice
        required: true
        default: none
        options:
          - none
          - create-draft

permissions:
  contents: read

concurrency:
  group: signed-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require explicit authorization and every signing secret
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          PUBLICATION: ${{ inputs.publication }}
          APPLE_DEVELOPER_ID_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          NOTARYTOOL_APPLE_ID: ${{ secrets.NOTARYTOOL_APPLE_ID }}
          NOTARYTOOL_TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
          NOTARYTOOL_PASSWORD: ${{ secrets.NOTARYTOOL_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/preflight.py
  build:
    needs: preflight
    uses: ./.github/workflows/native-build.yml
  sign-and-draft:
    needs: [preflight, build]
    runs-on: macos-15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-*
          path: downloads
      - name: Verify native handoff and assemble
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python scripts/release/artifacts.py unpack downloads/native-macos/native.tar inputs/macos
          python scripts/release/artifacts.py unpack downloads/native-windows/native.tar inputs/windows
          python scripts/release/artifacts.py assemble --inputs inputs --bundle package/ULID.bundle --sha "$SOURCE_SHA"
      - name: Developer ID sign, notarize and validate final distributions
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ github.sha }}
          APPLE_DEVELOPER_ID_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          NOTARYTOOL_APPLE_ID: ${{ secrets.NOTARYTOOL_APPLE_ID }}
          NOTARYTOOL_TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
          NOTARYTOOL_PASSWORD: ${{ secrets.NOTARYTOOL_PASSWORD }}
        run: bash scripts/release/sign.sh
      - name: Create draft and verify downloaded asset bytes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" dist/* --draft --target "$SOURCE_SHA" --title "$RELEASE_TAG" \
            --notes "Developer ID signed and notarized macOS universal plugin; Windows x64 plugin is UNSIGNED. See RELEASE.md and attached provenance/checksums. Built from $SOURCE_SHA."
          mkdir downloaded-release
          gh release download "$RELEASE_TAG" --dir downloaded-release
          (cd downloaded-release && shasum -a 256 -c SHA256SUMS)
          python3 -c "import pathlib; a=pathlib.Path('dist'); b=pathlib.Path('downloaded-release'); assert {p.name:p.read_bytes() for p in a.iterdir()} == {p.name:p.read_bytes() for p in b.iterdir()}, 'Draft assets differ'"
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-validation
          path: |
            dist
            release-state/*.json
            release-state/*-signature.txt
          if-no-files-found: warn
      - name: Remove signing credentials
        if: always()
        run: |
          if [ -f release-state/build.keychain-db ]; then
            security delete-keychain "$PWD/release-state/build.keychain-db"
          fi
          rm -f release-state/certificate.p12
